<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maquetas de Inicio - Mis Memorias de Oro</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #E9E6EF; color: #2A2230; padding: 28px 16px 48px; }
  h1 { font-size: 1.15rem; text-align: center; font-weight: 600; }
  .lead { text-align: center; max-width: 640px; margin: 8px auto 28px; color: #5b5266; line-height: 1.5; font-size: .95rem; }
  .stage { display: flex; flex-wrap: wrap; gap: 36px; justify-content: center; align-items: flex-start; }
  figure { display: grid; gap: 12px; justify-items: center; }
  figcaption { max-width: 360px; text-align: center; font-size: .9rem; line-height: 1.45; color: #4a4254; }
  figcaption b { display: block; font-size: 1rem; color: #2A2230; margin-bottom: 2px; }

  .phone { width: 372px; height: 780px; border-radius: 38px; overflow: hidden; position: relative; border: 9px solid #1d1824; box-shadow: 0 18px 40px rgba(30,20,50,.28); display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow: hidden; padding: 22px 20px 12px; }
  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .scene { position: relative; overflow: hidden; }
  .scene::before { content: ""; position: absolute; border-radius: 50%; }
  .sea::before { width: 54px; height: 54px; right: 22%; top: 22%; background: #FFE08A; box-shadow: 0 0 0 14px rgba(255,224,138,.28); }
  .sea::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: 0; height: 38%; background: linear-gradient(#5E9FC4, #3D7DA6); border-radius: 50% 50% 0 0 / 30% 30% 0 0; }
  .sea { background: linear-gradient(#F7C98B, #F4A97E 62%, #E98E7A); }
  .garden { background: linear-gradient(#CFE6C8, #9CC79A); }
  .garden::before { width: 120px; height: 120px; left: -20px; bottom: -50px; background: #6FA877; }
  .garden::after { content: ""; position: absolute; width: 90px; height: 90px; right: -10px; bottom: -34px; border-radius: 50%; background: #4F8B5E; }
  .city { background: linear-gradient(#D9D4F2, #B7AEE0); }
  .city::before { width: 46px; height: 46px; left: 18%; top: 18%; background: #fff6; }
  .city::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(90deg,#7C70B8 0 18%,#6A5DA8 18% 40%,#8A7EC4 40% 62%,#6A5DA8 62% 84%,#7C70B8 84%); }

  /* ============ A · CUADERNO ============ */
  .A { background: #FFFDF9; color: #3A1F3D; font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif; }
  .A .hello { font-size: 1.95rem; line-height: 1.12; font-weight: 600; letter-spacing: -.01em; }
  .A .sub { margin-top: 6px; font-size: 1.12rem; color: #6c4a6f; font-style: italic; }
  .A .last { margin-top: 18px; background: #fff; border-radius: 6px 22px 6px 22px; overflow: hidden; border: 1.5px solid #EAD9A3; box-shadow: 0 10px 22px -14px rgba(58,31,61,.5); }
  .A .last .scene { height: 150px; }
  .A .last .cap { padding: 12px 16px 14px; }
  .A .last .t { font-size: 1.15rem; font-weight: 600; }
  .A .last .m { margin-top: 2px; font-family: system-ui, sans-serif; font-size: .85rem; color: #7b6580; }
  .A .last q { display: block; margin-top: 8px; font-size: 1.02rem; font-style: italic; line-height: 1.4; quotes: "«" "»"; }
  .A .ask { margin: 20px 0 10px; font-size: 1.05rem; color: #6c4a6f; font-style: italic; }
  .A .main { width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 20px; border: 0; border-radius: 18px; background: #E0A81E; color: #2e1a30; font: 600 1.25rem Georgia, serif; text-align: left; box-shadow: 0 6px 0 #B98607; }
  .A .main .i { font-size: 2rem; }
  .A .main small { display: block; font: 400 .88rem system-ui, sans-serif; margin-top: 1px; opacity: .85; }
  .A .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 16px; }
  .A .opt { display: grid; justify-items: center; gap: 6px; padding: 14px 4px 12px; border-radius: 16px; background: #fff; border: 1.5px solid #D7C79A; color: #3A1F3D; font: 600 .98rem Georgia, serif; }
  .A .opt .i { font-size: 1.7rem; color: #8A5A92; }
  .A .more { display: block; margin: 14px auto 0; font: .92rem system-ui, sans-serif; color: #7b6580; text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; }
  .A nav { display: grid; grid-template-columns: repeat(5,1fr); background: #3A1F3D; padding: 8px 4px 14px; }
  .A nav a { display: grid; justify-items: center; gap: 3px; padding: 6px 0; color: #CDB8D0; font: .74rem system-ui, sans-serif; text-decoration: none; }
  .A nav a .i { font-size: 1.45rem; }
  .A nav a.on { color: #FFD66B; font-weight: 700; }
  .A nav a.on .i { stroke-width: 2.2; }

  /* ============ B · LUZ ============ */
  .B { background: #F6FAF8; color: #1E3A36; font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif; }
  .B .top { display: flex; align-items: center; gap: 12px; }
  .B .av { width: 46px; height: 46px; border-radius: 50%; background: #0F7B6C; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 1.2rem; }
  .B .hello { font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
  .B .sub { color: #53706b; font-size: .98rem; margin-top: 2px; }
  .B .bar { margin-top: 18px; display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 16px; padding: 13px 14px; color: #6b8782; font-size: 1rem; box-shadow: 0 2px 0 #DCE9E5; }
  .B .big { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .B .act { display: flex; flex-direction: column; align-items: flex-start; gap: 22px; padding: 16px 16px 14px; border: 0; border-radius: 24px; color: #fff; text-align: left; font: 700 1.12rem ui-rounded, "Nunito", system-ui, sans-serif; line-height: 1.1; }
  .B .act .i { font-size: 2rem; background: rgba(255,255,255,.22); padding: 9px; width: 52px; height: 52px; border-radius: 16px; }
  .B .act small { display: block; font-weight: 500; font-size: .82rem; opacity: .92; margin-top: 3px; }
  .B .c1 { background: #E5604D; } .B .c2 { background: #0F7B6C; } .B .c3 { background: #D98A0B; } .B .c4 { background: #6D5BC6; }
  .B h2 { font-size: 1.1rem; margin: 22px 0 10px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
  .B h2 a { font-size: .9rem; font-weight: 600; color: #0F7B6C; }
  .B .cards { display: flex; gap: 12px; margin-right: -20px; }
  .B .card { flex: none; width: 200px; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 2px 0 #DCE9E5; }
  .B .card .scene { height: 104px; }
  .B .card div.t { padding: 10px 12px 12px; }
  .B .card b { display: block; font-size: 1rem; }
  .B .card span { display: block; font-size: .82rem; color: #53706b; margin-top: 2px; }
  .B nav { display: grid; grid-template-columns: repeat(5,1fr); background: #fff; padding: 8px 6px 14px; border-top: 1px solid #DCE9E5; }
  .B nav a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; color: #5b7772; font-size: .74rem; font-weight: 600; text-decoration: none; }
  .B nav a .i { font-size: 1.45rem; }
  .B nav a.on { color: #0F7B6C; }
  .B nav a.on .pill { background: #D4EEE8; }
  .B nav .pill { padding: 3px 16px; border-radius: 999px; display: grid; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="pen" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></symbol>
  <symbol id="cam" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.8"/></symbol>
  <symbol id="vid" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5l5-3v9l-5-3z"/></symbol>
  <symbol id="home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></symbol>
  <symbol id="book" viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="spark" viewBox="0 0 24 24"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></symbol>
  <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></symbol>
</svg>

<h1>Dos direcciones para el Inicio de la app</h1>
<p class="lead">Mismo contenido, dos personalidades. Las fotos son ilustraciones de ejemplo. Las dos usan botones con icono y palabra, y un recuerdo con foto a la vista.</p>

<div class="stage">

<figure>
  <div class="phone A">
    <div class="scroll">
      <div class="hello">Buenas tardes, Ana</div>
      <div class="sub">Tus recuerdos, bien guardados.</div>

      <div class="last">
        <div class="scene sea"></div>
        <div class="cap">
          <div class="t">Verano en Cádiz</div>
          <div class="m">Julio de 2000 · Tenías 25 años</div>
          <q>Fuimos a la playa todo el verano.</q>
        </div>
      </div>

      <div class="ask">¿Qué quieres recordar hoy?</div>
      <button class="main"><svg class="i"><use href="#mic"/></svg><span>Contar con mi voz<small>Habla y yo lo escribo</small></span></button>
      <div class="row">
        <button class="opt"><svg class="i"><use href="#pen"/></svg>Escribir</button>
        <button class="opt"><svg class="i"><use href="#cam"/></svg>Hacer foto</button>
        <button class="opt"><svg class="i"><use href="#vid"/></svg>Grabar vídeo</button>
      </div>
      <button class="more">Subir un archivo del móvil</button>
    </div>
    <nav>
      <a class="on"><svg class="i"><use href="#home"/></svg>Inicio</a>
      <a><svg class="i"><use href="#book"/></svg>Recuerdos</a>
      <a><svg class="i"><use href="#clock"/></svg>Mi vida</a>
      <a><svg class="i"><use href="#spark"/></svg>Resumen</a>
      <a><svg class="i"><use href="#user"/></svg>Perfil</a>
    </nav>
  </div>
  <figcaption><b>A · Cuaderno</b>Como un álbum de papel: letra con serifa, ciruela profunda y dorado miel (el "oro" del nombre). Un solo botón grande para lo principal, y el último recuerdo con su foto y tus propias palabras.</figcaption>
</figure>

<figure>
  <div class="phone B">
    <div class="scroll">
      <div class="top">
        <div class="av">A</div>
        <div><div class="hello">Hola, Ana</div><div class="sub">¿Qué quieres guardar hoy?</div></div>
      </div>
      <div class="bar"><svg class="i"><use href="#search"/></svg>Buscar en tus recuerdos</div>

      <div class="big">
        <button class="act c1"><svg class="i"><use href="#mic"/></svg><span>Contar con<br>mi voz</span></button>
        <button class="act c2"><svg class="i"><use href="#pen"/></svg><span>Escribir<small>un recuerdo</small></span></button>
        <button class="act c3"><svg class="i"><use href="#cam"/></svg><span>Hacer<br>una foto</span></button>
        <button class="act c4"><svg class="i"><use href="#vid"/></svg><span>Grabar<br>un vídeo</span></button>
      </div>

      <h2>Últimos recuerdos <a>Ver todos</a></h2>
      <div class="cards">
        <div class="card"><div class="scene sea"></div><div class="t"><b>Verano en Cádiz</b><span>2000 · Tenías 25 años</span></div></div>
        <div class="card"><div class="scene garden"></div><div class="t"><b>El huerto de la abuela</b><span>1983 · Tenías 8 años</span></div></div>
        <div class="card"><div class="scene city"></div><div class="t"><b>Viaje a Roma</b><span>2012 · Tenías 37 años</span></div></div>
      </div>
    </div>
    <nav>
      <a class="on"><span class="pill"><svg class="i"><use href="#home"/></svg></span>Inicio</a>
      <a><span class="pill"><svg class="i"><use href="#book"/></svg></span>Recuerdos</a>
      <a><span class="pill"><svg class="i"><use href="#clock"/></svg></span>Mi vida</a>
      <a><span class="pill"><svg class="i"><use href="#spark"/></svg></span>Resumen</a>
      <a><span class="pill"><svg class="i"><use href="#user"/></svg></span>Perfil</a>
    </nav>
  </div>
  <figcaption><b>B · Luz</b>Luminosa y directa: letra redondeada, verde azulado como base y un color propio para cada acción (voz, escribir, foto, vídeo), así se reconocen sin leer. Los recuerdos se deslizan como tarjetas con foto.</figcaption>
</figure>

</div>
</body>
</html>
